[project]
name = "athena-optimizer"
version = "0.1.0"
description = "Analyze Athena query history for cost and optimization"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "boto3>=1.34.0",
  "rank-bm25>=0.2.2",
  "scikit-learn>=1.5.0",
  "sqlglot>=23.0.0",
  "typer>=0.12.3",
]

[build-system]
requires = ["setuptools>=68.0", "wheel>=0.42"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[project.optional-dependencies]
dev = [
  "marimo>=0.9.0",
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]

[project.scripts]
athena-optimizer = "athena_optimizer.cli:app"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
